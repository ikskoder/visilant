# Reproducible release builds.
#
# Every step runs inside the Nix sandbox, so the only inputs are this repository
# and flake.lock. The job builds each target twice – the second pass uses
# `nix build --rebuild`, which rebuilds from scratch and fails if a single byte
# of the output differs – then publishes hashes and a signed provenance
# attestation so anyone can tie a downloaded archive to this commit.
#
# Every action is pinned to a commit, not a tag: a tag can be moved.
name: build

on:
  push:
    branches: [main]
    # Both shapes of tag this repository has used, 3.0 and v3.0.
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Before the build, not after it. An artifact built from a tree with a known,
  # fixable advisory in it is an artifact nobody wanted, and finding out
  # afterwards means finding out once it already exists.
  #
  # VISILANT_AUDIT_STRICT turns "the check could not run" into a failure. That is
  # the whole point of running it here: locally a missing tool is a warning so
  # the script stays usable on a machine that has none of them, and in CI a
  # warning nobody reads is the same as no check.
  #
  # The cost, stated rather than discovered later: `build` needs this job and
  # `release` needs `build`, so an npm registry hiccup, or a new high-severity
  # advisory with a fix in any of a thousand transitive dependencies, blocks a
  # release of code that was already written and already green. That is the
  # intended order - audit before the artifact exists, not after - but when it
  # bites, the fix is to bump the dependency or re-run, never to drop the job.
  audit:
    name: secrets, host paths and advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          # gitleaks scans the history, and a shallow checkout has none.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # pnpm audit reads pnpm-lock.yaml and asks the registry, so it needs
      # neither node_modules nor a build.
      - name: Audit
        env:
          VISILANT_AUDIT_STRICT: '1'
        run: nix develop --command ./scripts/audit.sh

  # The Nix build proves the bytes reproduce, and says nothing at all about
  # whether the code is right – a red typecheck and a broken test both build
  # perfectly. Release depends on this through `build`, so a tag cannot be
  # published past a failing check.
  quality:
    name: lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1

      # A tag names a version, and every artifact is named from `package.json`.
      # Tagging `v3.0.1` on a tree that still says `3.0.0` published a release
      # called one thing containing files called another, and the reproduce
      # workflow then looked for a hash under a name nothing had.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # Both shapes this repository has used: 3.0 and v3.0
          if [ "$TAG" != "$version" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not name version $version from package.json." >&2
            echo "Either move the tag or bump the version, but do not publish both." >&2
            exit 1
          fi
          echo "Tag $TAG matches package.json version $version"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same devshell the developer has, so node and pnpm are the versions
      # flake.lock pins rather than whatever the runner ships
      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      # Before the checks, not after them. `src/auto-imports.d.ts` and
      # `src/components.d.ts` are written by the Vite plugins and are not in the
      # repository, so on a fresh checkout `browser` and every auto-imported Vue
      # helper are undeclared and `tsc` reports hundreds of TS2304 errors. The
      # end-to-end run needs the same build anyway, so this costs nothing.
      - name: Build
        run: nix develop --command pnpm build

      - name: Lint
        run: nix develop --command pnpm exec eslint --no-cache .

      - name: Type check
        run: nix develop --command pnpm typecheck

      - name: Unit tests
        run: nix develop --command pnpm test run

      # No `--with-deps`: the shared libraries Chromium wants come from the
      # devshell's LD_LIBRARY_PATH, the same way they do on a developer's machine
      - name: Install Chromium for Playwright
        run: nix develop --command pnpm exec playwright install chromium

      - name: End-to-end tests
        run: nix develop --command pnpm test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  build:
    name: build ${{ matrix.target }}
    needs: [audit, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [firefox, chrome]
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Build
        run: nix build .#${{ matrix.target }} --print-build-logs

      - name: Rebuild and compare
        run: nix build .#${{ matrix.target }} --rebuild --print-build-logs

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          archive=$(find result/ -maxdepth 1 \( -name '*.xpi' -o -name '*.zip' \) | head -n1)
          install -m 644 "$archive" artifacts/
          install -m 644 result/SHA256SUMS "artifacts/SHA256SUMS-${{ matrix.target }}"
          install -m 644 result/SHA256SUMS-unpacked "artifacts/SHA256SUMS-unpacked-${{ matrix.target }}"
          echo "archive=artifacts/$(basename "$archive")" >> "$GITHUB_OUTPUT"
          cat "artifacts/SHA256SUMS-${{ matrix.target }}"

      - name: Attest provenance
        # Only for real releases – a signed statement about a throwaway branch
        # build would say nothing useful.
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.collect.outputs.archive }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visilant-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          # `git archive` below needs the commit itself, and a shallow checkout
          # of a tag is enough for that
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: downloads
          merge-multiple: true

      # AMO asks for the source, and it has to be the source these artifacts were
      # built from. It used to be made by hand with `git archive HEAD` on
      # whatever tree happened to be checked out, and it was never hashed
      # alongside the rest - so nothing tied it to the release it belongs to.
      - name: Pack the source
        run: |
          set -euo pipefail
          git archive --format=zip --output=source.zip "$GITHUB_SHA"

      - name: Assemble checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp downloads/*.xpi downloads/*.zip release/ 2>/dev/null || true
          cp downloads/SHA256SUMS-unpacked-* release/
          cp source.zip release/
          ( cd release && sha256sum *.xpi *.zip source.zip ) > release/SHA256SUMS
          cat release/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
