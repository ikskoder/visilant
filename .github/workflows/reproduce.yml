# Independent rebuild.
#
# Anyone can fork this repository, open Actions, and run this workflow against a
# released tag. It rebuilds from source on GitHub's runners and compares the
# result with the archive attached to that release. A green run by someone who
# does not hold the signing keys is the part that makes the claim worth
# anything.
name: reproduce

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to rebuild
        required: true
        default: main
      target:
        description: Which browser to build for
        required: true
        default: firefox
        type: choice
        options: [firefox, chrome]
      expected:
        description: sha256 of the published archive (optional – left empty, the release asset is fetched and compared)
        required: false
      source_repository:
        description: Where the published release lives. A fork has no releases of its own, so this has to name the original.
        required: true
        default: ikskoder/visilant
  schedule:
    # Weekly, so a build that stops reproducing is noticed without anyone
    # remembering to check.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      # The weekly run has no inputs, so it used to check out `main`, find no tag
      # of that name, and report a hash with nothing to compare it against – a
      # green run that had verified nothing. It resolves the newest release here
      # instead, which is the only thing there is a published hash for.
      - name: Decide what to rebuild
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Where the releases are. In a fork this is not the fork: it has no
          # releases of its own, so every lookup used to come back empty - and
          # with the error swallowed, the run went green having verified nothing.
          # That is the one outcome this workflow must never have.
          GH_REPO: ${{ inputs.source_repository || 'ikskoder/visilant' }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          echo "Releases are read from $GH_REPO"
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$ref" ]; then
              echo "No published release to rebuild." >&2
              exit 1
            fi
            echo "Newest release: $ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "target=${INPUT_TARGET:-firefox}" >> "$GITHUB_OUTPUT"
          echo "source_repo=$GH_REPO" >> "$GITHUB_OUTPUT"

      - name: Check out ${{ steps.target.outputs.ref }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          # `git tag --list` below needs the tags, and a ref checkout brings none
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Build
        run: nix build .#${{ steps.target.outputs.target }} --print-build-logs

      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ steps.target.outputs.source_repo }}
          REF: ${{ steps.target.outputs.ref }}
          EXPECTED: ${{ inputs.expected }}
        run: |
          set -euo pipefail
          archive=$(find result/ -maxdepth 1 \( -name '*.xpi' -o -name '*.zip' \) | head -n1)
          built=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "Built $(basename "$archive")"
          echo "  sha256: $built"

          # A tag is a released version, and a released version has a published
          # hash. Failing to find one means the lookup went wrong, not that there
          # is nothing to check - so it is an error rather than a shrug. The
          # download error used to be swallowed entirely.
          is_tag=false
          if [ -n "$(git tag --list "$REF")" ]; then
            is_tag=true
          fi

          expected="$EXPECTED"
          if [ -z "$expected" ] && [ "$is_tag" = "true" ]; then
            if ! gh release download "$REF" --pattern SHA256SUMS --dir published; then
              echo "Could not download SHA256SUMS for $REF from $GH_REPO." >&2
              exit 1
            fi
            expected=$(awk -v f="$(basename "$archive")" '$2 == f { print $1 }' published/SHA256SUMS)
            echo "Published sha256 for $REF: ${expected:-not listed}"
          fi

          if [ -z "$expected" ]; then
            if [ "$is_tag" = "true" ]; then
              echo "$REF is a released tag but no published hash names $(basename "$archive") – nothing was verified." >&2
              exit 1
            fi
            # A branch or a bare commit has nothing published to compare with,
            # which is the one case where recording the hash is the whole job
            echo "$REF is not a released tag – recording the hash only."
            exit 0
          fi

          if [ "$built" = "$expected" ]; then
            echo "MATCH – this build reproduces the published archive."
          else
            echo "MISMATCH – built $built, published $expected" >&2
            exit 1
          fi
